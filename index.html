<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Job Tracker</title>
<style>
:root {
  --bg: #0f1117; --card: #161922; --border: #1f2233; --accent: #ec4899;
  --green: #22c55e; --yellow: #eab308; --red: #ef4444; --purple: #a855f7;
  --cyan: #22d3ee; --orange: #fb923c; --text: #e0e0e0; --muted: #777;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }

.app { max-width:1000px; margin:0 auto; padding:20px; }

/* Header */
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
.header h1 { font-size:24px; font-weight:800; }
.header h1 span { color:var(--accent); }
.header .sub { color:var(--muted); font-size:12px; margin-top:2px; }
.refresh-btn { 
  background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:8px 16px; color:var(--text); cursor:pointer; font-size:13px;
}
.refresh-btn:hover { border-color:var(--accent); }

/* Stats */
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
.stat { background:var(--card); border-radius:12px; padding:14px; text-align:center; border:1px solid var(--border); }
.stat .n { font-size:24px; font-weight:800; }
.stat .l { font-size:11px; color:var(--muted); margin-top:2px; }
.stat.s1 .n { color:var(--green); }
.stat.s2 .n { color:var(--accent); }
.stat.s3 .n { color:var(--yellow); }
.stat.s4 .n { color:var(--cyan); }

/* Filters */
.filters { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.fbtn { 
  padding:6px 14px; border-radius:18px; border:1px solid var(--border); 
  background:var(--card); color:var(--muted); font-size:12px; cursor:pointer; 
}
.fbtn.on { background:var(--accent); color:#fff; border-color:var(--accent); }
.fbtn:hover { border-color:var(--accent); }

/* Table */
.table-wrap { overflow-x:auto; border-radius:12px; border:1px solid var(--border); }
table { width:100%; border-collapse:collapse; background:var(--card); }
th { 
  background:#0d0f13; padding:12px 14px; text-align:left; font-size:11px; 
  text-transform:uppercase; letter-spacing:0.5px; color:var(--muted);
  cursor:pointer; white-space:nowrap;
}
th:hover { color:var(--accent); }
td { padding:12px 14px; border-top:1px solid var(--border); font-size:13px; vertical-align:middle; }
tr:hover td { background:#1a1d28; }

.company { font-weight:700; color:#fff; }
.role { color:var(--muted); font-size:12px; max-width:250px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.salary { font-weight:800; color:var(--green); white-space:nowrap; }
.location { font-size:12px; color:var(--muted); }

/* Match bar */
.match-wrap { display:flex; align-items:center; gap:8px; min-width:100px; }
.match-bar { flex:1; height:6px; background:#222; border-radius:3px; overflow:hidden; }
.match-fill { height:100%; border-radius:3px; }
.match-pct { font-weight:700; font-size:12px; min-width:35px; }

/* Skills */
.skills { display:flex; flex-wrap:wrap; gap:3px; max-width:200px; }
.sk { padding:2px 6px; border-radius:6px; font-size:9px; background:#22c55e15; border:1px solid #22c55e40; color:#4ade80; }

/* Status badge */
.status { 
  padding:4px 10px; border-radius:12px; font-size:10px; font-weight:600; 
  text-transform:uppercase; display:inline-block; cursor:pointer;
}
.status.new { background:#6b728020; color:#9ca3af; }
.status.resume_ready { background:#22c55e20; color:var(--green); }
.status.applied { background:#3b82f620; color:#60a5fa; }
.status.interviewing { background:#a855f720; color:var(--purple); }
.status.offer { background:#22d3ee20; color:var(--cyan); }
.status.rejected { background:#ef444420; color:var(--red); }

/* Actions */
.actions { display:flex; gap:6px; }
.btn { 
  padding:6px 12px; border-radius:8px; font-size:11px; font-weight:600; 
  text-decoration:none; display:inline-flex; align-items:center; gap:4px;
  border:none; cursor:pointer;
}
.btn-apply { background:var(--accent); color:#fff; }
.btn-apply:hover { background:#db2777; text-decoration:none; }
.btn-resume { background:var(--green); color:#fff; }
.btn-resume:hover { background:#16a34a; text-decoration:none; }
.btn-resume.disabled { background:#333; color:#666; cursor:not-allowed; }

/* Empty state */
.empty { text-align:center; padding:60px 20px; color:var(--muted); }

/* Date header */
.date-header { 
  background:var(--bg); padding:10px 14px; font-size:12px; font-weight:600; 
  color:var(--accent); border-top:1px solid var(--border);
}

/* Modal */
.modal-bg { 
  position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; 
  display:none; align-items:center; justify-content:center; 
}
.modal-bg.show { display:flex; }
.modal { 
  background:var(--card); border-radius:16px; max-width:400px; width:90%; 
  padding:24px; 
}
.modal h3 { margin-bottom:16px; }
.modal .status-options { display:flex; flex-wrap:wrap; gap:8px; }
.modal .status-opt { 
  padding:8px 16px; border-radius:8px; border:1px solid var(--border); 
  background:var(--bg); color:var(--muted); cursor:pointer; font-size:12px;
}
.modal .status-opt:hover { border-color:var(--accent); }
.modal .status-opt.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.modal .close-btn { 
  margin-top:16px; width:100%; padding:10px; border-radius:8px; 
  background:var(--border); color:var(--text); border:none; cursor:pointer;
}

@media (max-width: 768px) {
  .stats { grid-template-columns:repeat(2,1fr); }
  .app { padding:12px; }
  th, td { padding:10px 8px; }
  .skills { display:none; }
}
</style>
</head>
<body>
<div class="app">

<div class="header">
  <div>
    <h1>💼 Job Tracker</h1>
    <p class="sub">Top jobs by pay • Auto-tailored resumes • <a href="#" onclick="alert('Run: ./scripts/compile_pdfs.sh');return false;">Compile PDFs</a></p>
  </div>
  <button class="refresh-btn" onclick="location.reload()">🔄 Refresh</button>
</div>

<div class="stats">
  <div class="stat s1"><div class="n" id="sTotal">0</div><div class="l">Total Jobs</div></div>
  <div class="stat s2"><div class="n" id="sReady">0</div><div class="l">Resume Ready</div></div>
  <div class="stat s3"><div class="n" id="sApplied">0</div><div class="l">Applied</div></div>
  <div class="stat s4"><div class="n" id="sAvgMatch">0%</div><div class="l">Avg Match</div></div>
</div>

<div class="filters">
  <button class="fbtn on" data-f="all">All</button>
  <button class="fbtn" data-f="resume_ready">✅ Resume Ready</button>
  <button class="fbtn" data-f="new">🆕 New</button>
  <button class="fbtn" data-f="applied">📤 Applied</button>
  <button class="fbtn" data-f="high_match">🎯 80%+ Match</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th onclick="sortBy('company')">Company ⇅</th>
        <th onclick="sortBy('role')">Role</th>
        <th onclick="sortBy('salary')">Salary ⇅</th>
        <th onclick="sortBy('match')">Match ⇅</th>
        <th>Skills</th>
        <th>Location</th>
        <th onclick="sortBy('status')">Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="jobsBody"></tbody>
  </table>
</div>

</div>

<!-- Status Modal -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3>Update Status</h3>
    <div class="status-options" id="statusOptions"></div>
    <button class="close-btn" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
const STATUSES = ['new', 'resume_ready', 'applied', 'interviewing', 'offer', 'rejected'];
const STATUS_LABELS = { 
  new: '🆕 New', resume_ready: '✅ Resume Ready', applied: '📤 Applied', 
  interviewing: '🎤 Interview', offer: '🎉 Offer', rejected: '❌ Rejected' 
};

let jobs = [];
let statusData = {};
let filter = 'all';
let sortKey = 'salary';
let sortDir = -1;
let currentJobId = null;

async function init() {
  try {
    const [jobsRes, statusRes] = await Promise.all([
      fetch('data/jobs.json'),
      fetch('data/status.json')
    ]);
    jobs = await jobsRes.json();
    const statusJson = await statusRes.json();
    statusData = statusJson.jobs || {};
  } catch(e) { 
    console.error('Failed to load data:', e);
    jobs = []; 
  }
  
  // Merge status into jobs
  jobs.forEach(j => {
    if (statusData[j.id]) {
      j.status = statusData[j.id].status || 'new';
      j.resumePath = statusData[j.id].resume || null;
    } else {
      j.status = 'new';
    }
  });
  
  sortJobs();
  render();
  setupFilters();
}

function setupFilters() {
  document.querySelectorAll('.fbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      filter = btn.dataset.f;
      render();
    });
  });
}

function sortBy(key) {
  if (sortKey === key) sortDir *= -1;
  else { sortKey = key; sortDir = -1; }
  sortJobs();
  render();
}

function sortJobs() {
  jobs.sort((a, b) => {
    let va, vb;
    if (sortKey === 'salary') { va = a.salary || 0; vb = b.salary || 0; }
    else if (sortKey === 'match') { va = a.match; vb = b.match; }
    else if (sortKey === 'company') return sortDir * a.company.localeCompare(b.company);
    else if (sortKey === 'status') return sortDir * STATUSES.indexOf(a.status) - STATUSES.indexOf(b.status);
    else { va = 0; vb = 0; }
    return sortDir * (vb - va);
  });
}

function filterJobs(j) {
  if (filter === 'all') return true;
  if (filter === 'resume_ready') return j.status === 'resume_ready';
  if (filter === 'new') return j.status === 'new';
  if (filter === 'applied') return ['applied', 'interviewing', 'offer'].includes(j.status);
  if (filter === 'high_match') return j.match >= 80;
  return true;
}

function matchColor(pct) {
  if (pct >= 80) return 'var(--green)';
  if (pct >= 70) return 'var(--yellow)';
  return 'var(--orange)';
}

function getResumeUrl(job) {
  if (!job.resumePath) return null;
  // Convert absolute path to relative (handle both sandbox and host paths)
  let path = job.resumePath
    .replace('/workspace/sneha-job-tracker/', '')
    .replace('/Users/vamsiv/.openclaw/workspace/sneha-job-tracker/', '');
  return path;
}

function render() {
  const visible = jobs.filter(filterJobs);
  const tbody = document.getElementById('jobsBody');
  
  if (!visible.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty">No jobs found</td></tr>';
    updateStats([]);
    return;
  }
  
  tbody.innerHTML = visible.map(j => {
    const salary = j.salary ? `$${(j.salary/1000).toFixed(0)}K` : 'N/A';
    const resumeUrl = getResumeUrl(j);
    
    return `
      <tr>
        <td class="company">${escapeHtml(j.company)}</td>
        <td class="role" title="${escapeHtml(j.role)}">${escapeHtml(j.role)}</td>
        <td class="salary">${salary}</td>
        <td>
          <div class="match-wrap">
            <div class="match-bar">
              <div class="match-fill" style="width:${j.match}%;background:${matchColor(j.match)}"></div>
            </div>
            <span class="match-pct" style="color:${matchColor(j.match)}">${j.match}%</span>
          </div>
        </td>
        <td>
          <div class="skills">
            ${(j.skillsHave || []).slice(0,4).map(s => `<span class="sk">${escapeHtml(s)}</span>`).join('')}
          </div>
        </td>
        <td class="location">📍 ${escapeHtml(j.location)}</td>
        <td>
          <span class="status ${j.status}" onclick="openStatusModal('${j.id}')">${STATUS_LABELS[j.status] || j.status}</span>
        </td>
        <td>
          <div class="actions">
            <a href="${escapeHtml(j.url)}" target="_blank" class="btn btn-apply">Apply →</a>
            ${resumeUrl 
              ? `<a href="${escapeHtml(resumeUrl)}" download class="btn btn-resume">${resumeUrl.endsWith('.pdf') ? '📄 PDF' : '📝 LaTeX'}</a>`
              : `<span class="btn btn-resume disabled">No Resume</span>`
            }
          </div>
        </td>
      </tr>
    `;
  }).join('');
  
  updateStats(visible);
}

function updateStats(visible) {
  const all = jobs;
  document.getElementById('sTotal').textContent = all.length;
  document.getElementById('sReady').textContent = all.filter(j => j.status === 'resume_ready').length;
  document.getElementById('sApplied').textContent = all.filter(j => ['applied','interviewing','offer'].includes(j.status)).length;
  const avg = all.length ? Math.round(all.reduce((s,j) => s + j.match, 0) / all.length) : 0;
  document.getElementById('sAvgMatch').textContent = avg + '%';
}

function openStatusModal(jobId) {
  currentJobId = jobId;
  const job = jobs.find(j => j.id === jobId);
  const container = document.getElementById('statusOptions');
  
  container.innerHTML = STATUSES.map(s => `
    <div class="status-opt ${job.status === s ? 'active' : ''}" onclick="setStatus('${s}')">${STATUS_LABELS[s]}</div>
  `).join('');
  
  document.getElementById('modalBg').classList.add('show');
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('show');
  currentJobId = null;
}

function setStatus(status) {
  if (!currentJobId) return;
  const job = jobs.find(j => j.id === currentJobId);
  if (job) {
    job.status = status;
    // Save to localStorage for persistence
    const saved = JSON.parse(localStorage.getItem('sneha_job_status') || '{}');
    saved[currentJobId] = { status };
    localStorage.setItem('sneha_job_status', JSON.stringify(saved));
  }
  closeModal();
  render();
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Load saved statuses from localStorage
function loadSavedStatuses() {
  const saved = JSON.parse(localStorage.getItem('sneha_job_status') || '{}');
  jobs.forEach(j => {
    if (saved[j.id]) {
      j.status = saved[j.id].status || j.status;
    }
  });
}

init().then(loadSavedStatuses).then(render);
</script>
</body>
</html>
